location = /rustdesk {
    return 308 https://www.ccrosrobot.com/rustdesk/;
}

location ^~ /rustdesk/static/ {
    alias /opt/rustdesk-web/app/staticfiles/;
    autoindex off;
    include /etc/nginx/snippets/rustdesk-web-headers.conf;
}

location = /rustdesk/api/login {
    limit_req zone=rustdesk_web_client_login burst=10 nodelay;
    include /etc/nginx/snippets/rustdesk-web-proxy.conf;
    proxy_pass http://127.0.0.1:18761/api/login;
}

location = /rustdesk/admin/login/ {
    limit_req zone=rustdesk_web_admin_login burst=5 nodelay;
    include /etc/nginx/snippets/rustdesk-web-proxy.conf;
    proxy_pass http://127.0.0.1:18761/admin/login/;
}

location = /rustdesk/api/wechat/start {
    limit_req zone=rustdesk_web_client_login burst=10 nodelay;
    include /etc/nginx/snippets/rustdesk-web-proxy.conf;
    proxy_pass http://127.0.0.1:18761/api/wechat/start;
}

location = /rustdesk/api/wechat/link {
    limit_req zone=rustdesk_web_client_login burst=10 nodelay;
    include /etc/nginx/snippets/rustdesk-web-proxy.conf;
    proxy_pass http://127.0.0.1:18761/api/wechat/link;
}

location = /rustdesk/api/wechat/callback {
    access_log off;
    error_log /var/log/nginx/rustdesk-wechat-callback.error.log crit;
    limit_req zone=rustdesk_web_api burst=25 nodelay;
    include /etc/nginx/snippets/rustdesk-web-proxy.conf;
    proxy_pass http://127.0.0.1:18761/api/wechat/callback;
}

location ^~ /rustdesk/api/ {
    limit_req zone=rustdesk_web_api burst=25 nodelay;
    include /etc/nginx/snippets/rustdesk-web-proxy.conf;
    proxy_pass http://127.0.0.1:18761/api/;
}

location ^~ /rustdesk/ {
    include /etc/nginx/snippets/rustdesk-web-proxy.conf;
    proxy_pass http://127.0.0.1:18761/;
}
