map $request_method $rustdesk_web_login_ip {
    default "";
    POST $binary_remote_addr;
}

map $uri $rustdesk_web_referrer_policy {
    default same-origin;
    /rustdesk/api/wechat/callback no-referrer;
}

limit_req_zone $rustdesk_web_login_ip zone=rustdesk_web_admin_login:10m rate=6r/m;
limit_req_zone $rustdesk_web_login_ip zone=rustdesk_web_client_login:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=rustdesk_web_api:10m rate=12r/s;
